; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = gladiator_s3
; Local-only overrides (the OTA password lives here); see platformio_local.ini.example.
extra_configs = platformio_local.ini

[env:gladiator_s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts =
    pre:scripts/bounded_sh2.py
    post:tools/no_digest_image.py
; main.cpp is the S3 application; src/bench holds bench-only sketches with
; their own setup/loop, so they must stay out of this image.
build_src_filter = +<*> -<bench/>
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB
upload_port = COM25
upload_speed = 460800
monitor_port = COM25
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=1
lib_deps =
	adafruit/Adafruit BNO08x@1.2.5
	bblanchon/ArduinoJson@7.4.2

[env:gladiator_ota]
extends = env:gladiator_s3
upload_protocol = espota
upload_port = 192.168.4.1
; upload_flags (--auth=<OTA password>) comes from platformio_local.ini.

; SEN0628 bench rig: a CYD (ESP32-2432S028R) running the real MatrixLidarSensor
; driver over its CN1 header, with the 64 zones drawn on the panel.
; Sensor: GND, GPIO27 = SDA, GPIO22 = SCL, 3V3 = 3V3.
[env:cyd_bench]
platform = espressif32@7.0.1
board = esp32dev
framework = arduino
upload_port = COM6
monitor_port = COM6
monitor_speed = 115200
upload_speed = 460800
build_src_filter = +<bench/> +<sensors/MatrixLidarSensor.cpp>
build_flags =
	-DCORE_DEBUG_LEVEL=1
; TFT_eSPI is configured here rather than by editing the library's User_Setup.h,
; so a library reinstall cannot silently change the panel wiring.
	-DUSER_SETUP_LOADED=1
; Most ESP32-2432S028R boards are ILI9341; if the panel stays white or the
; colours invert, swap this for -DST7789_DRIVER or plain -DILI9341_DRIVER.
	-DILI9341_2_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	-DTFT_MISO=12
	-DTFT_MOSI=13
	-DTFT_SCLK=14
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=-1
	-DTFT_BL=21
	-DTFT_BACKLIGHT_ON=HIGH
; The panel sits on the ESP32 HSPI pins; the touch controller gets VSPI in
; CydMatrixView.cpp, so the two never share a bus.
	-DUSE_HSPI_PORT=1
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DSPI_FREQUENCY=55000000
	-DSPI_READ_FREQUENCY=20000000
; SensorData.h carries the IMU struct's sh2 types, so the BNO08x library is
; needed to compile even though this bench only reads the ToF sensor.
lib_deps =
	adafruit/Adafruit BNO08x@1.2.5
	bodmer/TFT_eSPI@^2.5.43
